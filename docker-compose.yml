version: "3.8"

services:

  backend:
    build: .
    container_name: websocket-backend

    restart: unless-stopped

    expose:
      - "8000"

    networks:
      - websocket-network

  nginx:
    image: nginx:latest

    container_name: websocket-nginx

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - websocket-network

networks:
  websocket-network:
    driver: bridge